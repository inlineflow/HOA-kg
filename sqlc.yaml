version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema"
    queries: "db/queries"
    gen:
      go:
        out: "internal/database"
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
            nullable: yes
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/govalues/decimal.Decimal"
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/govalues/decimal.Decimal"
            nullable: yes
